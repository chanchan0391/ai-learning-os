version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Keep runtime types aligned with the supported Node 22 major.
      - dependency-name: "@types/node"
        versions:
          - ">=23"
      # jsdom 30 requires a newer Node 22 minor than the current dev runtime.
      - dependency-name: jsdom
        versions:
          - ">=30"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
