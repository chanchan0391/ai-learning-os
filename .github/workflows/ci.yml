name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Run tests and production build
        run: npm run check
      - name: Install performance acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Run browser performance acceptance
        run: npm run acceptance:performance
      - name: Run browser accessibility acceptance
        run: npm run acceptance:accessibility
      - name: Create build provenance
        run: |
          mkdir build-provenance
          npm sbom --omit=dev --sbom-format=cyclonedx > build-provenance/sbom.cdx.json
          printf '%s\n' "$GITHUB_SHA" > build-provenance/SOURCE_COMMIT
          find dist build-provenance -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > build-provenance/SHA256SUMS
          shasum -a 256 --check build-provenance/SHA256SUMS
      - name: Retain build provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-learning-os-build-${{ github.sha }}
          path: |
            dist/
            build-provenance/
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC0-1.0, ISC, MIT, MIT-0, MPL-2.0
